<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e7">
  <title>Reload Data — Istighosah</title>
  <link rel="stylesheet" href="./r.css">
</head>
<body data-page="reload">
  <main class="reload-shell">
    <header class="reload-header">
      <div class="reload-mark">↻</div>
      <div>
        <h1>Reload Data</h1>
        <p>Pembaruan dan reset pengaturan aplikasi</p>
      </div>
    </header>

    <section class="reload-panel" aria-live="polite">
      <h2 id="reload-status">Siap melakukan pembaruan</h2>
      <p id="reload-detail">Tekan tombol di bawah untuk memulai. Jangan tutup halaman selama proses berlangsung.</p>

      <div class="reload-progress" role="progressbar" aria-label="Progres pembaruan" aria-valuemin="0" aria-valuemax="100">
        <div id="reload-progress-fill"></div>
      </div>
      <div class="reload-progress-meta">
        <span>Progres</span>
        <strong id="reload-progress-label">0%</strong>
      </div>

      <button id="reload-start" type="button">Mulai Pembaruan</button>
      <button id="reload-return" type="button" hidden>Kembali ke Halaman Utama</button>
    </section>

    <p class="reload-footnote">Cache lama dipertahankan sampai data baru berhasil diunduh dan diverifikasi.</p>
  </main>
  <script src="./r.js"></script>
</body>
</html>
