<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
	<link rel="manifest" href="./app/manifest.webmanifest">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>الإسـتغـاثـة</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #app-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="app-frame"
    title="Aplikasi Istighosah"
    allow="fullscreen"
  ></iframe>

  <noscript>JavaScript harus diaktifkan untuk membuka aplikasi.</noscript>

  <script src="./app/android/install.js"></script>
  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);
    document.getElementById('app-frame').src = isAndroid
      ? './app/android/an.html'
      : './app/pc/pc.html';
  </script>
</body>
</html>
